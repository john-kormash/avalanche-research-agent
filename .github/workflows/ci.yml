name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The recorded fixtures go stale when CAIC changes their payloads. A weekly
  # run against live endpoints surfaces that drift before it breaks a season.
  schedule:
    - cron: "0 15 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check avalanche tests scripts
      - run: pytest

  upstream-drift:
    # Only on the schedule: hits the real CAIC and SNOTEL APIs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Re-record fixtures from live APIs
        run: python scripts/refresh_fixtures.py
      - name: Fail if the recorded schema no longer parses
        run: pytest tests/test_parsing.py
