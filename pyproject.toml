[project]
name = "caic-avalanche-search"
version = "0.1.0"
description = "Agentic search over Colorado Avalanche Information Center data, exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]
dev = ["mcp>=2.0,<3", "pytest>=8.0", "pytest-asyncio>=0.24", "anyio>=4.0", "ruff>=0.6"]

[project.scripts]
avalanche = "avalanche.cli:main"
caic-mcp = "avalanche.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["avalanche"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
